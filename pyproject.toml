[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exocam-accelerate"
version = "0.1.0"
description = "Safeguarded convergence acceleration for ExoCAM/CESM climate simulations via restart-field extrapolation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eric T. Wolf" }]
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
# netCDF4 is only needed by the (future) restart-file layer, never by the
# pure-computation core in trends/safeguards/schedule/stepper.
netcdf = ["netCDF4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
